services:
  qbittorrent-wireguard:
    cap_add:
      - "NET_ADMIN"
    container_name: "qbittorrent-wireguard"
    entrypoint:
      - "/bin/bash"
      - "/start.sh"
    environment:
      - "PUID=1000"
      - "PGID=100"
      - "LAN_NETWORK=192.168.190.0/24"
      - "QBT_LEGAL_NOTICE=confirm"
      - "ENABLE_SSL=no"
      - "HEALTH_CHECK_HOST=one.one.one.one"
      - "HEALTH_CHECK_INTERVAL=15"
      - "HEALTH_CHECK_AMOUNT=3"
      - "HEALTH_CHECK_SILENT=0"
      - "RESTART_CONTAINER=no"
    build: ./.
    ipc: "private"
    network_mode: "bridge"
    restart: "unless-stopped"
    ports:
      - "8180:8080/tcp"
    security_opt:
      - "label=disable"
    stdin_open: true
    sysctls:
      - "net.ipv4.conf.all.rp_filter=2"
      - "net.ipv4.conf.all.src_valid_mark=1"
      - "net.ipv6.conf.all.disable_ipv6=1"
    tty: true
    volumes:
      - "/mnt/cryptostorage/inf/Torrent/docker-qbittorrent-wireguard-download:/downloads"
      - "/home/inf/Projects/docker-qbittorrent-wireguard/config:/config"
    working_dir: "/opt"
    x-podman.uidmaps:
      - "0:1:999"
      - "1000:0:1"
      - "1001:1000:64536"
    x-podman.gidmaps:
      - "0:1:99"
      - "100:0:1"
      - "101:100:64536"
