services:
  qbittorrent-wireguard:
    cap_add:
      - "NET_ADMIN"
      - "NET_RAW"
    container_name: "qbittorrent-wireguard"
    entrypoint:
      - "/bin/bash"
      - "/start.sh"
    environment:
      - "PUID=1000"
      - "PGID=100"
      - "LAN_NETWORK=192.168.190.0/24"
      - "QBT_LEGAL_NOTICE=confirm"
      - "ENABLE_SSL=no"
      - "HEALTH_CHECK_HOST=one.one.one.one"
      - "HEALTH_CHECK_INTERVAL=15"
      - "HEALTH_CHECK_AMOUNT=3"
      - "HEALTH_CHECK_SILENT=0"
      - "RESTART_CONTAINER=no"
      - "TZ=Etc/UTC"
    build: ./.
    ipc: "private"
    network_mode: "bridge"
    restart: "unless-stopped"
    ports:
      - "8180:8080/tcp"
    security_opt:
      - "label=disable"
    stdin_open: true
    sysctls:
      - "net.ipv4.conf.all.rp_filter=2"
      - "net.ipv4.conf.all.src_valid_mark=1"
      - "net.ipv6.conf.all.disable_ipv6=1"
    tty: true
    volumes:
      - "/mnt/cryptostorage/inf/Torrent/docker-qbittorrent-wireguard-download:/downloads"
      - "/home/inf/Projects/docker-qbittorrent-wireguard/qbittorrent_config:/config"
    working_dir: "/opt"
    x-podman.uidmaps: &uidmap
      - "0:1:999"
      - "1000:0:1"
      - "1001:1000:64536"
    x-podman.gidmaps: &gidmap
      - "0:1:99"
      - "100:0:1"
      - "101:100:64536"
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "bridge"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/inf/Projects/docker-qbittorrent-wireguard/lidarr_config:/config
      - /mnt/cryptostorage/inf/Media Library/Lidarr Music:/music #optional
      - /mnt/cryptostorage/inf/Torrent/docker-qbittorrent-wireguard-download:/downloads #optional
    ports:
      - 8686:8686
    restart: unless-stopped
    x-podman.uidmaps: *uidmap
    x-podman.gidmaps: *gidmap
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "bridge"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/inf/Projects/docker-qbittorrent-wireguard/prowlarr_config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    x-podman.uidmaps: *uidmap
    x-podman.gidmaps: *gidmap
